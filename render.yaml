services:
  - type: web
    name: algions-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build --workspace=@algions/api
    startCommand: npm run start --workspace=@algions/api
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://*.vercel.app,https://alg-ecom.vercel.app,http://localhost:3000
      - key: ADMIN_USERNAME
        value: admin@algions.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_APP_PASSWORD
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false
      - key: DB_BACKUP_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: STORE_CURRENCY
        value: INR
      - key: STORE_COUNTRY
        value: IN
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: HEAVYWEIGHT Protocol <noreply@algions.com>
