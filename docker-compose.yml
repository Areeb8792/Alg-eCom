# ==============================================================================
# Algions AI Labs — Production-Style Docker Compose Orchestration
# ==============================================================================
name: algions-platform

services:
  # 1. Database Service (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: algions-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-algions_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${DB_NAME:-algions_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network
    # IMPORTANT: Port 5432 is strictly kept internal to prevent public exposure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-algions_user} -d ${DB_NAME:-algions_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Product and Order API Service (Node.js LTS / TypeScript)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: ${API_IMAGE:-ghcr.io/sayyeds/algions-api:latest}
    container_name: algions-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-algions_user}:${DB_PASSWORD:-change_me_in_production}@postgres:5432/${DB_NAME:-algions_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_replace_with_strong_random_secret_in_prod}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@algions.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_admin_secure_password_2024}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network
    # Security hardening settings
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:4000/api/v1/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Web & Reverse Proxy Service (Nginx + React SPA)
  nginx:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-ghcr.io/sayyeds/algions-web:latest}
    container_name: algions-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  internal_network:
    driver: bridge
    name: algions-internal-bridge

volumes:
  postgres_data:
    name: algions-postgres-storage
