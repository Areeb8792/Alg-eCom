# ==============================================================================
# Algions AI Labs — Production-Style Docker Compose Orchestration (Local Build)
# Services: PostgreSQL, Product & Order API, Nginx TLS Proxy, Prometheus, Grafana
# ==============================================================================
name: algions-platform

services:
  # 1. Database Service (PostgreSQL 16 Alpine)
  postgres:
    image: postgres:16-alpine
    container_name: algions-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-algions_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-algions_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network
    # IMPORTANT: Port 5432 is strictly kept internal to prevent public internet exposure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-algions_user} -d ${DB_NAME:-algions_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 2. Product and Order API Service (Node.js LTS / TypeScript)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-algions-api:local}
    container_name: algions-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-algions_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-algions_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@algions.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:80,https://localhost,https://algions.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:4000/api/v1/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. Web & Reverse Proxy Service (Nginx + React SPA)
  nginx:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-algions-web:local}
    container_name: algions-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/ && wget -q --spider --no-check-certificate https://localhost/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 4. Metrics Collection Service (Prometheus 3.x LTS)
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: algions-prometheus
    restart: unless-stopped
    user: "nobody"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 5. Observability Visualization Service (Grafana 13.x)
  grafana:
    image: grafana/grafana:13.3.0
    container_name: algions-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      # Restrict administrative monitoring interface strictly to localhost (127.0.0.1)
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - internal_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  internal_network:
    driver: bridge
    name: algions-internal-bridge

volumes:
  postgres_data:
    name: algions-postgres-storage
  prometheus_data:
    name: algions-prometheus-storage
  grafana_data:
    name: algions-grafana-storage
