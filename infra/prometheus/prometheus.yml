# ==============================================================================
# Algions Platform — Prometheus Operational Scrape Configuration
# ==============================================================================
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: 'algions-api'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['api:4000']
        labels:
          application: 'heavyweight-ecommerce'
          environment: 'production'
          service: 'product-and-order-api'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
