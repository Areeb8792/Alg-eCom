name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-checks-and-tests:
    name: Code Quality, Tests & Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algions_user
          POSTGRES_PASSWORD: algions_password
          POSTGRES_DB: algions_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: algions_user
      DB_PASSWORD: algions_password
      DB_NAME: algions_db
      DATABASE_URL: postgresql://algions_user:algions_password@localhost:5432/algions_db
      JWT_SECRET: super_secure_ci_jwt_secret_at_least_32_characters_long
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime LTS (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Verify TypeScript Type Integrity
        run: npm run typecheck

      - name: Run ESLint & Static Analysis
        run: npm run lint

      - name: Initialize Database Schema & Seed
        run: |
          npm run db:migrate --workspace=@algions/api
          npm run db:seed --workspace=@algions/api

      - name: Execute Automated Test Suite (Unit, Idempotency, Concurrency)
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Background Development Servers for E2E
        run: |
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3000 http://localhost:4000/api/v1/health/live --timeout 30000

      - name: Execute End-to-End Browser Test Suite
        run: npm run test:e2e

      - name: Verify API Multi-Stage Docker Build
        run: |
          docker build -t algions-api:test -f apps/api/Dockerfile .

      - name: Verify Web Multi-Stage Docker Build
        run: |
          docker build -t algions-web:test -f apps/web/Dockerfile .

      - name: Run Trivy Container Vulnerability Scan (API)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 algions-api:test

      - name: Run Trivy Container Vulnerability Scan (Web)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 algions-web:test
