name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-checks-and-tests:
    name: Code Quality, Tests & Security Scan
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: algions_user
      DB_PASSWORD: algions_password
      DB_NAME: algions_db
      DB_APP_USER: algions_app
      DB_APP_PASSWORD: algions_app_ci_password_secure
      DB_MIGRATION_USER: algions_admin
      DB_MIGRATION_PASSWORD: algions_admin_ci_password_secure
      DB_BACKUP_USER: algions_backup
      DB_BACKUP_PASSWORD: algions_backup_ci_password_secure
      DATABASE_URL: postgresql://algions_app:algions_app_ci_password_secure@127.0.0.1:5432/algions_db
      JWT_SECRET: super_secure_ci_jwt_secret_at_least_32_characters_long
      CORS_ORIGIN: 'http://localhost:3000,http://127.0.0.1:3000,http://localhost:80,http://127.0.0.1:80,http://localhost:4000,http://127.0.0.1:4000,https://localhost,https://127.0.0.1,https://algions.com'
      PORT: '4000'
      HOST: 0.0.0.0
      NODE_ENV: test

    steps:
      - name: Disable Pre-installed Host PostgreSQL Service
        run: |
          sudo systemctl stop postgresql.service 2>/dev/null || true
          sudo systemctl disable postgresql.service 2>/dev/null || true

      - name: Start Isolated PostgreSQL 16 Container
        run: |
          docker run -d \
            --name algions-ci-postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=algions_user \
            -e POSTGRES_PASSWORD=algions_password \
            -e POSTGRES_DB=algions_db \
            postgres:16-alpine

          for i in $(seq 1 30); do
            if docker exec algions-ci-postgres pg_isready -U algions_user -d algions_db; then
              echo "PostgreSQL is ready and accepting connections."
              break
            fi
            echo "Waiting for postgres ($i/30)..."
            sleep 1
          done

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime LTS (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Verify TypeScript Type Integrity
        run: npm run typecheck

      - name: Run ESLint & Static Analysis
        run: npm run lint

      - name: Initialize Database Schema & Seed
        run: |
          echo "=== Step 10: Initialize Database Schema, Least-Privilege Roles & Verify Security Boundary ==="
          # 1. Apply Schema via bootstrap superuser
          docker exec -i -e PGPASSWORD="$DB_PASSWORD" algions-ci-postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 < apps/api/src/database/schema.sql
          echo "✓ Schema applied successfully."

          # 2. Apply Least-Privilege Roles with dynamic variable password injection (no static credentials in SQL)
          docker exec -i -e PGPASSWORD="$DB_PASSWORD" algions-ci-postgres psql -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -v admin_password="$DB_MIGRATION_PASSWORD" \
            -v app_password="$DB_APP_PASSWORD" \
            -v backup_password="$DB_BACKUP_PASSWORD" \
            < apps/api/src/database/roles.sql
          echo "✓ Roles and ownership transfer applied successfully."

          # 3. Verify Table Ownership transferred to algions_admin
          TABLE_OWNERS=$(docker exec -i -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d "$DB_NAME" -t -c "SELECT DISTINCT tableowner FROM pg_tables WHERE schemaname = 'public';" | tr -d ' \r\n')
          echo "✓ Public table owner in PostgreSQL: ${TABLE_OWNERS}"
          if [ "$TABLE_OWNERS" != "algions_admin" ]; then
            echo "::error title=OWNERSHIP_MISMATCH::Expected public table owner to be algions_admin, got '$TABLE_OWNERS'"
            exit 1
          fi

          # 4. Verify DDL Migration capability for algions_admin (Can execute ALTER TABLE migrations)
          docker exec -i -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "ALTER TABLE products ADD COLUMN ci_migration_test_col VARCHAR(32); ALTER TABLE products DROP COLUMN ci_migration_test_col;"
          echo "✓ Confirmed: algions_admin successfully executed DDL migration on existing table."

          # 5. Live privilege boundary verification: Ensure runtime algions_app CANNOT execute DDL (CREATE TABLE)
          if docker exec -i -e PGPASSWORD="$DB_APP_PASSWORD" algions-ci-postgres psql -U "$DB_APP_USER" -d "$DB_NAME" -c "CREATE TABLE unauthorized_privilege_test (id int);" 2>&1 | grep -q "permission denied"; then
            echo "✓ Confirmed: algions_app role cannot create tables (least-privilege boundary verified)."
          else
            echo "::error title=LEAST_PRIVILEGE_VIOLATION::algions_app was unexpectedly able to create tables!"
            exit 1
          fi

          # 6. Live privilege boundary verification: Ensure runtime algions_app CANNOT modify audit_events
          if docker exec -i -e PGPASSWORD="$DB_APP_PASSWORD" algions-ci-postgres psql -U "$DB_APP_USER" -d "$DB_NAME" -c "UPDATE audit_events SET action = 'tampered';" 2>&1 | grep -qE "permission denied|Security Policy Violation"; then
            echo "✓ Confirmed: algions_app role cannot update audit_events (immutability boundary verified)."
          else
            echo "::error title=AUDIT_TAMPERING_VIOLATION::algions_app was unexpectedly able to update audit_events!"
            exit 1
          fi

          # 7. Verify algions_backup role can execute pg_dump successfully
          docker exec -i -e PGPASSWORD="$DB_BACKUP_PASSWORD" algions-ci-postgres pg_dump -U "$DB_BACKUP_USER" -d "$DB_NAME" --schema-only > /dev/null
          echo "✓ Confirmed: algions_backup role successfully executed pg_dump."

          # 8. Seed Database using algions_admin credentials
          DATABASE_URL="postgresql://${DB_MIGRATION_USER}:${DB_MIGRATION_PASSWORD}@127.0.0.1:5432/${DB_NAME}" npx tsx apps/api/src/database/seed.ts
          echo "✓ Seed completed successfully using algions_admin credentials."

      - name: Execute Automated Test Suite (Unit, Idempotency, Concurrency)
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Background Development Servers for E2E
        run: |
          npm run dev:api &
          npm run dev:web &
          npx wait-on http-get://127.0.0.1:3000 http-get://127.0.0.1:4000/api/v1/health/live --timeout 30000

      - name: Execute End-to-End Browser Test Suite
        run: npm run test:e2e

      - name: Verify API Multi-Stage Docker Build
        run: |
          docker build -t algions-api:test -f apps/api/Dockerfile .

      - name: Verify Web Multi-Stage Docker Build
        run: |
          docker build -t algions-web:test -f apps/web/Dockerfile .

      - name: Run Trivy Container Vulnerability Scan (API)
        run: |
          echo "=== Scanning algions-api:test for HIGH severity vulnerabilities (audit log) ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH --ignore-unfixed --exit-code 0 algions-api:test
          echo "=== Enforcing ZERO fixable CRITICAL vulnerabilities on algions-api:test ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 algions-api:test

      - name: Run Trivy Container Vulnerability Scan (Web)
        run: |
          echo "=== Scanning algions-web:test for HIGH severity vulnerabilities (audit log) ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH --ignore-unfixed --exit-code 0 algions-web:test
          echo "=== Enforcing ZERO fixable CRITICAL vulnerabilities on algions-web:test ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 algions-web:test

      - name: Stop PostgreSQL Container
        if: always()
        run: docker rm -f algions-ci-postgres 2>/dev/null || true
