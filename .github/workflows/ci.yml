name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-checks-and-tests:
    name: Code Quality, Tests & Security Scan
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: algions_user
      DB_PASSWORD: algions_password
      DB_NAME: algions_db
      DB_APP_USER: algions_app
      DB_APP_PASSWORD: algions_app_ci_password_secure
      DB_MIGRATION_USER: algions_admin
      DB_MIGRATION_PASSWORD: algions_admin_ci_password_secure
      DB_BACKUP_USER: algions_backup
      DB_BACKUP_PASSWORD: algions_backup_ci_password_secure
      DATABASE_URL: postgresql://algions_app:algions_app_ci_password_secure@127.0.0.1:5432/algions_db
      JWT_SECRET: super_secure_ci_jwt_secret_at_least_32_characters_long
      CORS_ORIGIN: 'http://localhost:3000,http://127.0.0.1:3000,http://localhost:80,http://127.0.0.1:80,http://localhost:4000,http://127.0.0.1:4000,https://localhost,https://127.0.0.1,https://algions.com'
      PORT: '4000'
      HOST: 0.0.0.0
      NODE_ENV: test

    steps:
      - name: Disable Pre-installed Host PostgreSQL Service
        run: |
          sudo systemctl stop postgresql.service 2>/dev/null || true
          sudo systemctl disable postgresql.service 2>/dev/null || true

      - name: Start Isolated PostgreSQL 16 Container
        run: |
          docker run -d \
            --name algions-ci-postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=algions_user \
            -e POSTGRES_PASSWORD=algions_password \
            -e POSTGRES_DB=algions_db \
            postgres:16-alpine

          for i in $(seq 1 30); do
            if docker exec algions-ci-postgres pg_isready -U algions_user -d algions_db; then
              echo "PostgreSQL is ready and accepting connections."
              break
            fi
            echo "Waiting for postgres ($i/30)..."
            sleep 1
          done

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime LTS (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Verify TypeScript Type Integrity
        run: npm run typecheck

      - name: Run ESLint & Static Analysis
        run: npm run lint

      - name: Initialize Database Schema & Seed
        run: |
          echo "=== Step 10: Initialize Database Schema, Least-Privilege Roles & Verify Security Boundary ==="
          # 1. Apply Schema via bootstrap superuser
          docker exec -i -e PGPASSWORD="$DB_PASSWORD" algions-ci-postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 < apps/api/src/database/schema.sql
          echo "✓ Schema applied successfully."

          # 2a. Fail-closed verification: Ensure roles.sql FAILS when variables are absent
          FAIL_CLOSED_OUT=$(docker exec -i -e PGPASSWORD="$DB_PASSWORD" algions-ci-postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 < apps/api/src/database/roles.sql 2>&1 || true)
          if echo "$FAIL_CLOSED_OUT" | grep -q "FATAL: Required psql variable"; then
            echo "✓ Confirmed: roles.sql fails closed when required password variables are missing."
          else
            echo "::error title=FAIL_CLOSED_VIOLATION::roles.sql did not fail when password variables were absent! Output: $FAIL_CLOSED_OUT"
            exit 1
          fi

          # 2b. Apply Least-Privilege Roles with validated dynamic variable password injection (no static credentials in SQL)
          docker exec -i -e PGPASSWORD="$DB_PASSWORD" algions-ci-postgres psql -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -v admin_password="$DB_MIGRATION_PASSWORD" \
            -v app_password="$DB_APP_PASSWORD" \
            -v backup_password="$DB_BACKUP_PASSWORD" \
            < apps/api/src/database/roles.sql
          echo "✓ Roles and ownership transfer applied successfully."

          # 3. Authentication Verification: Confirm all three roles authenticate with assigned credentials
          ADMIN_AUTH=$(docker exec -i -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d "$DB_NAME" -t -A -c "SELECT current_user;")
          APP_AUTH=$(docker exec -i -e PGPASSWORD="$DB_APP_PASSWORD" algions-ci-postgres psql -U "$DB_APP_USER" -d "$DB_NAME" -t -A -c "SELECT current_user;")
          BACKUP_AUTH=$(docker exec -i -e PGPASSWORD="$DB_BACKUP_PASSWORD" algions-ci-postgres psql -U "$DB_BACKUP_USER" -d "$DB_NAME" -t -A -c "SELECT current_user;")
          echo "✓ Verified role authentication: admin='${ADMIN_AUTH}', app='${APP_AUTH}', backup='${BACKUP_AUTH}'"
          if [ "$ADMIN_AUTH" != "algions_admin" ] || [ "$APP_AUTH" != "algions_app" ] || [ "$BACKUP_AUTH" != "algions_backup" ]; then
            echo "::error title=AUTH_VERIFICATION_FAILED::Role authentication probe failed!"
            exit 1
          fi

          # 4. Verify Table Ownership transferred to algions_admin
          TABLE_OWNERS=$(docker exec -i -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d "$DB_NAME" -t -c "SELECT DISTINCT tableowner FROM pg_tables WHERE schemaname = 'public';" | tr -d ' \r\n')
          echo "✓ Public table owner in PostgreSQL: ${TABLE_OWNERS}"
          if [ "$TABLE_OWNERS" != "algions_admin" ]; then
            echo "::error title=OWNERSHIP_MISMATCH::Expected public table owner to be algions_admin, got '$TABLE_OWNERS'"
            exit 1
          fi

          # 5. Verify DDL Migration capability for algions_admin (Can execute ALTER TABLE migrations)
          docker exec -i -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "ALTER TABLE products ADD COLUMN ci_migration_test_col VARCHAR(32); ALTER TABLE products DROP COLUMN ci_migration_test_col;"
          echo "✓ Confirmed: algions_admin successfully executed DDL migration on existing table."

          # 6. Live privilege boundary verification: Ensure runtime algions_app CANNOT execute DDL (CREATE TABLE)
          if docker exec -i -e PGPASSWORD="$DB_APP_PASSWORD" algions-ci-postgres psql -U "$DB_APP_USER" -d "$DB_NAME" -c "CREATE TABLE unauthorized_privilege_test (id int);" 2>&1 | grep -q "permission denied"; then
            echo "✓ Confirmed: algions_app role cannot create tables (least-privilege boundary verified)."
          else
            echo "::error title=LEAST_PRIVILEGE_VIOLATION::algions_app was unexpectedly able to create tables!"
            exit 1
          fi

          # 7. Live privilege boundary verification: Ensure runtime algions_app CANNOT modify audit_events
          if docker exec -i -e PGPASSWORD="$DB_APP_PASSWORD" algions-ci-postgres psql -U "$DB_APP_USER" -d "$DB_NAME" -c "UPDATE audit_events SET action = 'tampered';" 2>&1 | grep -qE "permission denied|Security Policy Violation"; then
            echo "✓ Confirmed: algions_app role cannot update audit_events (immutability boundary verified)."
          else
            echo "::error title=AUDIT_TAMPERING_VIOLATION::algions_app was unexpectedly able to update audit_events!"
            exit 1
          fi

          # 8. Verify algions_backup role is strictly read-only and CANNOT write data
          if docker exec -i -e PGPASSWORD="$DB_BACKUP_PASSWORD" algions-ci-postgres psql -U "$DB_BACKUP_USER" -d "$DB_NAME" -c "INSERT INTO products (name) VALUES ('fail');" 2>&1 | grep -q "permission denied"; then
            echo "✓ Confirmed: algions_backup role is strictly read-only and cannot write data."
          else
            echo "::error title=BACKUP_WRITE_VIOLATION::algions_backup was unexpectedly able to write data!"
            exit 1
          fi

          # 9. Seed Database using algions_admin credentials
          DATABASE_URL="postgresql://${DB_MIGRATION_USER}:${DB_MIGRATION_PASSWORD}@127.0.0.1:5432/${DB_NAME}" npx tsx apps/api/src/database/seed.ts
          echo "✓ Seed completed successfully using algions_admin credentials."

          # 10. Full Backup & Restore Drill: Execute pg_dump -Fc with table data as algions_backup, restore into disposable DB
          echo "=== Executing Full Disaster-Recovery Backup Drill via algions_backup ==="
          docker exec -e PGPASSWORD="$DB_BACKUP_PASSWORD" algions-ci-postgres pg_dump -U "$DB_BACKUP_USER" -d "$DB_NAME" -Fc -f /tmp/ci_full_backup.dump
          BACKUP_SIZE=$(docker exec algions-ci-postgres wc -c /tmp/ci_full_backup.dump | awk '{print $1}')
          echo "✓ Backup archive created (${BACKUP_SIZE} bytes)."
          if [ "$BACKUP_SIZE" -lt 1000 ]; then
            echo "::error title=BACKUP_TOO_SMALL::Backup archive is smaller than expected 1KB (${BACKUP_SIZE} bytes)!"
            exit 1
          fi

          # Create disposable test database owned by algions_admin (never modifying active algions_db)
          docker exec -e PGPASSWORD="$DB_PASSWORD" algions-ci-postgres psql -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS algions_ci_disposable_restore_db; CREATE DATABASE algions_ci_disposable_restore_db OWNER algions_admin;"
          echo "✓ Created disposable restoration target database: algions_ci_disposable_restore_db."

          # Restore using algions_admin into disposable database
          docker exec -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres pg_restore -U "$DB_MIGRATION_USER" -d algions_ci_disposable_restore_db --no-owner /tmp/ci_full_backup.dump
          echo "✓ Restored backup archive into disposable database."

          # Verify restored records and queries in disposable database
          RESTORED_PRODUCTS=$(docker exec -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d algions_ci_disposable_restore_db -t -A -c "SELECT COUNT(*) FROM products;")
          RESTORED_ADMINS=$(docker exec -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d algions_ci_disposable_restore_db -t -A -c "SELECT COUNT(*) FROM admin_users;")
          RESTORED_AUDIT=$(docker exec -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d algions_ci_disposable_restore_db -t -A -c "SELECT COUNT(*) FROM audit_events;")
          SAMPLE_PROD=$(docker exec -e PGPASSWORD="$DB_MIGRATION_PASSWORD" algions-ci-postgres psql -U "$DB_MIGRATION_USER" -d algions_ci_disposable_restore_db -t -A -c "SELECT name FROM products WHERE slug = 'statement-puffer';")
          echo "✓ Verified restored records in disposable DB: products=${RESTORED_PRODUCTS}, admins=${RESTORED_ADMINS}, audit_events=${RESTORED_AUDIT}, sample='${SAMPLE_PROD}'"
          if [ "$RESTORED_PRODUCTS" -lt 3 ] || [ "$SAMPLE_PROD" != "Statement Puffer" ]; then
            echo "::error title=RESTORE_DATA_MISMATCH::Restored database records did not match expected seed data!"
            exit 1
          fi

          # Clean up disposable database and container backup artifact
          docker exec -e PGPASSWORD="$DB_PASSWORD" algions-ci-postgres psql -U "$DB_USER" -d postgres -c "DROP DATABASE algions_ci_disposable_restore_db;"
          docker exec algions-ci-postgres rm -f /tmp/ci_full_backup.dump
          echo "✓ Disposable test database dropped cleanly. Active database '${DB_NAME}' remains persistent and untouched."

      - name: Execute Automated Test Suite (Unit, Idempotency, Concurrency)
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Background Development Servers for E2E
        run: |
          npm run dev:api &
          npm run dev:web &
          npx wait-on http-get://127.0.0.1:3000 http-get://127.0.0.1:4000/api/v1/health/live --timeout 30000

      - name: Execute End-to-End Browser Test Suite
        run: npm run test:e2e

      - name: Verify API Multi-Stage Docker Build
        run: |
          docker build -t algions-api:test -f apps/api/Dockerfile .

      - name: Verify Web Multi-Stage Docker Build
        run: |
          docker build -t algions-web:test -f apps/web/Dockerfile .

      - name: Run Trivy Container Vulnerability Scan (API)
        run: |
          echo "=== Scanning algions-api:test for HIGH severity vulnerabilities (audit log) ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH --ignore-unfixed --exit-code 0 algions-api:test
          echo "=== Enforcing ZERO fixable CRITICAL vulnerabilities on algions-api:test ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 algions-api:test

      - name: Run Trivy Container Vulnerability Scan (Web)
        run: |
          echo "=== Scanning algions-web:test for HIGH severity vulnerabilities (audit log) ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH --ignore-unfixed --exit-code 0 algions-web:test
          echo "=== Enforcing ZERO fixable CRITICAL vulnerabilities on algions-web:test ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 algions-web:test

      - name: Stop PostgreSQL Container
        if: always()
        run: docker rm -f algions-ci-postgres 2>/dev/null || true
